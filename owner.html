<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard | Kelsiy's Closet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Kelsiy's Closet</h1>
        <p>Owner Dashboard</p>
        <button id="logout-button" type="button">Log Out</button>
    </header>

    <main class="dashboard-container">
        <h2>Welcome to Your Dashboard</h2>
        <p>Manage your fashion business from one place.</p>

        <nav class="dashboard-nav">
            <button type="button" data-section="home">Home</button>
            <button type="button" data-section="inventory">Inventory</button>
            <button type="button" data-section="sales">Sales</button>
            <button type="button" data-section="reports">Sales Reports</button>
            <button type="button" data-section="contacts">Contacts</button>
        </nav>

        <section id="dashboard-content">
            <h2>Home</h2>
            <p>Your business dashboard will appear here.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
